<style>/* vendor/leaflet.css */
/* required styles */

.leaflet-pane,
.leaflet-tile,

	max-width: none !important;

	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}

	-ms-touch-action: pinch-zoom;

	}
.leaflet-tile-loaded {
	visibility: inherit;

	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }

.leaflet-tooltip-pane   { z-index: 650; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}

	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}

.leaflet-interactive {
	cursor: pointer;

.leaflet-grab {

	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;

	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,

	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(images/layers.png);
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(images/layers-2x.png);

	width: 44px;

	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;

	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

	border-bottom: 2px solid #777;

	font-size: 13px;

	margin: 17px 0;
	margin: 1.3em 0;
	}

	height: 20px;

<style>/* design-system/components.css */
/* Giro: component styles. Every value comes from tokens.css. */
body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--ink); -webkit-font-smoothing: antialiased; }
.gr-num { font-variant-numeric: tabular-nums; }
.gr-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Icon */
.gr-icon { display: inline-block; flex: none; vertical-align: middle; }

/* Button */
.gr-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-md); padding: 0 var(--space-4); border: 0; border-radius: var(--radius-md); font: inherit; font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s ease, transform .1s ease; }
.gr-btn:active:not(:disabled) { transform: scale(.98); }
.gr-btn:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.gr-btn:disabled { opacity: .4; cursor: not-allowed; }
.gr-btn-lg { height: var(--control-lg); padding: 0 var(--space-6); font-size: 16px; }
.gr-btn-block { display: flex; width: 100%; }
.gr-btn-primary { background: var(--accent); color: var(--on-accent); }
.gr-btn-primary:hover:not(:disabled) { background: var(--accent-ink); color: var(--surface); }
.gr-btn-secondary { background: var(--surface-muted); color: var(--ink); }
.gr-btn-secondary:hover:not(:disabled) { background: var(--line); }
.gr-btn-ghost { background: transparent; color: var(--ink); }
.gr-btn-ghost:hover:not(:disabled) { background: var(--surface-muted); }

/* IconButton */
.gr-iconbtn { display: inline-grid; place-items: center; width: var(--control-md); height: var(--control-md); padding: 0; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s ease, transform .1s ease; position: relative; }
.gr-iconbtn:hover { background: var(--surface-muted); }
.gr-iconbtn:active { transform: scale(.94); }
.gr-iconbtn:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.gr-iconbtn-floating { background: var(--surface); box-shadow: var(--shadow-sm); }
.gr-iconbtn-floating:hover { background: var(--surface); }
.gr-iconbtn-floating:focus-visible { box-shadow: var(--shadow-sm), var(--focus-ring); }
.gr-iconbtn-sm { width: var(--control-sm); height: var(--control-sm); }
.gr-iconbtn-sm::after { content: ""; position: absolute; inset: -4px; }
.gr-iconbtn-outline { box-shadow: inset 0 0 0 1px var(--line-strong); }
.gr-iconbtn-outline:hover { background: var(--surface-muted); }
.gr-iconbtn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.gr-iconbtn-dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: var(--radius-full); background: var(--ink); color: var(--surface); font-size: 11px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Chip */
.gr-chip { display: inline-flex; align-items: center; gap: 6px; height: var(--control-sm); padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
.gr-chip::after { content: ""; position: absolute; inset: -4px 0; }
.gr-chip:hover { border-color: var(--line-strong); }
.gr-chip:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.gr-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.gr-chip-floating { border-color: transparent; box-shadow: var(--shadow-sm); }

/* Badge */
.gr-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding: 0 var(--space-2); border-radius: var(--radius-sm); background: var(--surface-muted); color: var(--ink); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.gr-badge-accent { background: var(--accent-soft); color: var(--accent-ink); }
.gr-badge-danger { background: var(--danger-soft); color: var(--danger); }

/* SearchBar */
.gr-search { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-1) var(--space-1) 0; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-lg); }
.gr-search-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-3); padding: 6px var(--space-2) 6px var(--space-4); border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.gr-search-main:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.gr-search-text { min-width: 0; display: flex; flex-direction: column; }
.gr-search-place { font-size: 15px; line-height: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gr-search-when { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gr-search-sep { width: 1px; height: 28px; background: var(--line); flex: none; }

.check input { width: 22px; height: 22px; accent-color: var(--accent-ink); }

.segmented { display: flex; gap: 4px; margin: 0 var(--space-4) var(--space-2); padding: 4px; border-radius: var(--radius-md); background: var(--surface-muted); flex: none; }
.segmented button { flex: 1; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-muted); font-size: 14px; font-weight: 600; cursor: pointer; }
.segmented [aria-selected="true"], .segmented [aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.segmented button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- Car art ---------- */
.car-art { display: block; width: 100%; height: auto; }
.car-art-shadow { fill: var(--ink); opacity: .1; }
.car-art-body { stroke: #0000002e; stroke-width: 1; }
.car-art-glass { fill: #1f2a33; opacity: .88; }
.car-art-line { stroke: #00000038; stroke-width: 1.5; fill: none; }
.car-art-line-fill { fill: #00000040; }
.car-art-head { fill: #fff6d6; stroke: #00000026; }
.car-art-tail { fill: #c4321b; }
.car-art-tire { fill: #1d1e21; }
.car-art-rim { fill: #a9acb1; stroke: #6d7076; stroke-width: 1.5; }
.car-thumb { display: grid; place-items: center; flex: none; border-radius: var(--radius-sm); background: var(--surface-muted); overflow: hidden; }
.car-thumb .car-art { width: 88%; }
.gr-car-thumb img { object-fit: contain; padding: 4px; box-sizing: border-box; }
.car-thumb-md { width: 64px; height: 64px; }
.car-thumb-lg { width: 88px; height: 64px; }

/* ---------- Car page ---------- */
.hero { position: relative; padding: 76px var(--space-6) var(--space-6); background: var(--surface-muted); }
.hero-art { max-width: 340px; margin: 0 auto; }
.hero-tag { position: absolute; left: var(--space-4); bottom: var(--space-3); font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.fav-on { color: var(--accent-ink); }
.fav-on svg { fill: currentColor; }
.car-title { margin: 0; font-size: 24px; line-height: 30px; font-weight: 650; letter-spacing: -0.01em; }
.car-sub { display: flex; align-items: center; gap: 4px; margin: var(--space-1) 0 var(--space-3); font-size: 14px; line-height: 20px; color: var(--ink-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.car-sub .gr-icon { color: var(--ink); }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.features { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.features li { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-muted); font-size: 14px; line-height: 18px; font-weight: 500; }
.host { display: flex; align-items: center; gap: var(--space-3); }
.review { padding: var(--space-3) 0; }
.review + .review { border-top: 1px solid var(--line); }
.review-head { display: flex; align-items: center; gap: var(--space-3); }
.review p { margin: var(--space-2) 0 0; font-size: 15px; line-height: 22px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); font-size: 15px; line-height: 22px; }
.rules li { display: flex; gap: var(--space-2); align-items: flex-start; }
.rules .gr-icon { margin-top: 3px; color: var(--accent-ink); }

/* ---------- Checkout & pay ---------- */
.checkout-car { display: flex; gap: var(--space-3); align-items: center; }
.pay { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4) var(--space-6); }
.pay-amount { margin: var(--space-2) 0 0; text-align: center; font-size: 34px; line-height: 40px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pay .muted { margin: 0; }
.qr-wrap { position: relative; align-self: center; width: 216px; padding: 12px; border-radius: var(--radius-md); background: #ffffff; box-shadow: 0 0 0 1px var(--line); }
.qr { display: block; width: 100%; height: auto; fill: #141516; }
.qr .qr-bg { fill: #ffffff; }
.qr-demo { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); padding: 2px 8px; border-radius: var(--radius-full); background: var(--ink); color: var(--surface); font-size: 11px; font-weight: 600; white-space: nowrap; }
.waiting { display: flex; align-items: center; justify-content: center; gap: var(--space-2); margin-top: var(--space-2); font-size: 14px; font-weight: 500; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; }
.spinner-lg { width: 48px; height: 48px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.pay-status { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); margin-top: 120px; }
.pay-status-title { margin: 0; font-size: 22px; line-height: 28px; font-weight: 650; }
.big-check { display: grid; place-items: center; width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: var(--on-accent); animation: pop .4s cubic-bezier(.3,.7,.4,1.4); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Confirmed ---------- */
.confirmed-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-3); padding-top: var(--space-8); }
.confirmed-hero p { margin: 0; max-width: 300px; line-height: 22px; }
.code { white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: .04em; color: var(--ink); }
.confirmed-art { max-width: 260px; margin: var(--space-6) auto; }

/* ---------- Trips ---------- */
.trip { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-3); margin-bottom: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); text-align: left; cursor: pointer; }
@media (hover: hover) { .trip:hover { border-color: var(--line-strong); } }
.trip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.trip-meta { display: flex; align-items: center; gap: var(--space-2); margin-top: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.empty-big { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: 64px var(--space-6); text-align: center; }
.empty-big p { margin: 0; }
.empty-big .gr-btn { margin-top: var(--space-3); }
.empty-icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--surface-muted); margin-bottom: var(--space-2); }
.booking-head { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); text-align: center; }
.booking-art { max-width: 220px; }
.live { margin: 0 var(--space-4) var(--space-4); padding: var(--space-4); border-radius: var(--radius-md); background: var(--ink); color: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.live-label { font-size: 13px; font-weight: 500; opacity: .8; }
.live-time { font-size: 28px; line-height: 34px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.live-bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--surface) 25%, transparent); overflow: hidden; margin: var(--space-2) 0 var(--space-3); }
.live-bar span { display: block; height: 100%; background: var(--accent); }
.live-actions { display: flex; gap: var(--space-2); }
.live-actions .gr-btn { flex: 1; background: color-mix(in srgb, var(--surface) 14%, transparent); color: var(--surface); }
.timeline { list-style: none; display: flex; margin: 0; padding: var(--space-2) var(--space-4) var(--space-4); }
.timeline li { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.timeline li::before { content: ""; position: absolute; top: 5px; right: 50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.timeline li:first-child::before { display: none; }
.timeline li.done::before { background: var(--ink); }
.tl-dot { position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line-strong); }
.timeline li.done { color: var(--ink); }
.timeline li.done .tl-dot { background: var(--ink); box-shadow: none; }
.timeline li.next .tl-dot { box-shadow: inset 0 0 0 2px var(--ink); }
.confirm-box { padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); }
.confirm-box p { margin: 0 0 var(--space-1); }
.row-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
.danger-text { color: var(--danger) !important; }
.rated { display: flex; align-items: center; gap: var(--space-3); }

/* Inspection & photos */
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-4); }
.shot { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink-muted); cursor: pointer; overflow: hidden; }
.shot:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.shot-done { border: 0; background: var(--surface-muted); }
.shot-art { width: 90%; }
.shot-art.flip { transform: scaleX(-1); }
.shot-art.zoom { transform: scale(1.7) translateX(12%); }
.shot-label { position: absolute; left: 8px; bottom: 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
.shot-ok { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); }
.center-col { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-3); }
.rate-art { max-width: 220px; margin-top: var(--space-6); }
.star-pick { display: flex; gap: var(--space-1); }
.star-pick button { padding: 4px; border: 0; background: none; color: var(--line-strong); cursor: pointer; border-radius: var(--radius-sm); }
.star-pick button.on { color: var(--ink); }
.star-pick button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tag-wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-top: var(--space-3); }
.chat { display: flex; flex-direction: column; gap: var(--space-2); }
.bubble { align-self: flex-start; max-width: 78%; margin: 0; padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: var(--surface-muted); font-size: 15px; line-height: 21px; }
.bubble-me { align-self: flex-end; border-radius: 18px 18px 6px 18px; background: var(--ink); color: var(--surface); }
.chat-form { display: flex; gap: var(--space-2); align-items: center; }
.chat-form input { flex: 1; height: 44px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--ink); font: inherit; font-size: 16px; outline: none; }
.chat-form input:focus { box-shadow: var(--focus-ring); }

/* ---------- Host ---------- */
.earn, .estimate { display: flex; flex-direction: column; gap: 2px; }
.earn-label { font-size: 14px; line-height: 20px; color: var(--ink-muted); font-weight: 500; }
.earn-value { font-size: 36px; line-height: 42px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.earn-delta { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent-ink); }
.estimate { margin-top: var(--space-6); padding: var(--space-4); border-radius: var(--radius-md); background: var(--surface-muted); }
.chart { margin: var(--space-6) 0 var(--space-2); }
.chart-plot { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart g { outline: none; cursor: default; }
.chart-base { stroke: var(--line); stroke-width: 1; }
.chart-bar { fill: var(--line-strong); transition: fill .15s ease; }
.chart-bar-now { fill: var(--ink); }
.chart-bar-hover { fill: var(--ink-muted); }
.chart-bar-now.chart-bar-hover { fill: var(--ink); }
.chart-label { fill: var(--ink-muted); font-size: 10px; font-weight: 500; font-family: var(--font-sans); }
.chart-tip { position: absolute; top: -8px; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--ink); color: var(--surface); font-size: 12px; line-height: 16px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.chart-tip strong { font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-4); }
.stats div { display: flex; flex-direction: column; padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-muted); }
.stat-v { font-size: 20px; line-height: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; line-height: 16px; color: var(--ink-muted); font-weight: 500; }
.host-res { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; }
.listing { padding: var(--space-3) 0 var(--space-4); border-bottom: 1px solid var(--line); margin-bottom: var(--space-4); }
.listing-main { display: flex; align-items: center; gap: var(--space-3); }
.listing-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
.listing-edit { display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-4); padding: var(--space-4); border-radius: var(--radius-md); background: var(--surface-muted); }
.progress { height: 3px; margin: 0 var(--space-4); border-radius: 2px; background: var(--line); flex: none; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ink); transition: width .3s ease; }
.suggest { display: block; padding: var(--space-3); border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; line-height: 20px; font-weight: 500; }
.suggest strong { font-weight: 650; white-space: nowrap; }
.suggest .gr-icon { margin: -2px 6px 0 0; }
.big-stepper { display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-6); }
.days { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.review-card { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-6); padding: var(--space-3); }

/* ---------- Profile ---------- */
.profile-head { display: flex; align-items: center; gap: var(--space-4); padding-bottom: 0; }

/* ---------- Welcome ---------- */
.welcome { background: var(--surface); }
.welcome-art { position: relative; flex: 1; min-height: 0; background: var(--map-land); overflow: hidden; }
.welcome-art::before { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, transparent 47%, var(--map-road) 47%, var(--map-road) 53%, transparent 53%),
  linear-gradient(0deg, transparent 30%, var(--map-road) 30%, var(--map-road) 34%, transparent 34%, transparent 70%, var(--map-road) 70%, var(--map-road) 74%, transparent 74%); }
.welcome-car { position: absolute; width: 190px; }
.welcome-car-0 { left: -24px; top: 18%; }
.welcome-car-1 { right: -16px; top: 42%; width: 210px; }
.welcome-car-2 { left: 30px; bottom: 6%; }
.welcome-text { padding: var(--space-6) var(--space-6) var(--space-2); }
.welcome-name { margin: 0; font-size: 64px; line-height: .95; font-weight: 650; letter-spacing: -0.04em; }
.welcome-line { margin: var(--space-3) 0 0; font-size: 17px; line-height: 25px; color: var(--ink-muted); font-weight: 500; }
.welcome-foot { border-top: 0; }

/* ---------- Toast ---------- */
.toast { position: absolute; z-index: 1000; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box; padding: 10px 16px; border-radius: var(--radius-full); background: var(--ink); color: var(--surface); font-size: 14px; line-height: 20px; font-weight: 500; box-shadow: var(--shadow-lg); white-space: nowrap; animation: toast-in .25s cubic-bezier(.2,.7,.2,1); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -12px); } }

</style>
